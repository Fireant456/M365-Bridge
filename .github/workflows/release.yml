name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Compile and Release Installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out Repository Code
        uses: actions/checkout@v4

      - name: Extract Version Number from ISS File
        id: get_version
        shell: powershell
        run: |
          $targetFile = "./M365Bridge.iss"
          if (-not (Test-Path $targetFile)) {
              Write-Error "Critical Build Failure: Missing configuration asset at $targetFile"
              exit 1
          }

          $versionLine = Get-Content $targetFile | Where-Object { $_ -match "^#define\s+ReleaseVersion" }

          if ($versionLine) {
              $version = ($versionLine -split '\s+')[2].Replace('"', '').Trim()
              Write-Host "Found version string in M365Bridge.iss: $version"
              [System.IO.File]::AppendAllLines($env:GITHUB_OUTPUT, "VERSION=$version")
          } else {
              Write-Error "Could not locate 'ReleaseVersion' key within M365Bridge.iss file."
              exit 1
          }

      - name: Compile Inno Setup Script
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: ./M365Bridge.iss
          options: /o+

      - name: Create GitHub Release and Upload Artifact
        uses: softprops/action-gh-release@v2
        with:
          files: Output/M365BridgeInstaller_*.exe
          name: "M365 Bridge ${{ steps.get_version.outputs.VERSION }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
